<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Gaji - Arwana Pro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

/* ============ ANIMASI BACKGROUND ============ */
body {
    display: flex;
    min-height: 100vh;
    background: linear-gradient(-45deg, #ff6b35, #f7931e, #ff4757, #c44569, #6a0572, #1a1a2e);
    background-size: 400% 400%;
    animation: sunsetMove 20s ease infinite;
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
}

@keyframes sunsetMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
.particle { position: absolute; width: 6px; height: 6px; background: radial-gradient(circle, #ffcc00, #ff6b35); border-radius: 50%; box-shadow: 0 0 15px #ff6b35, 0 0 30px #ff4757; animation: floatUp linear infinite; opacity: 0.8; }
@keyframes floatUp {
    0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) translateX(100px) scale(1); opacity: 0; }
}

.cloud { position: absolute; background: rgba(255, 255, 255, 0.15); border-radius: 100px; filter: blur(20px); animation: cloudMove linear infinite; }
@keyframes cloudMove { from { transform: translateX(-300px); } to { transform: translateX(calc(100vw + 300px)); } }

.chakra { position: fixed; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(255,107,53,0.3), transparent 70%); pointer-events: none; z-index: 0; animation: chakraPulse 4s ease-in-out infinite; }
.chakra:nth-child(1) { top: -100px; left: -100px; }
.chakra:nth-child(2) { bottom: -100px; right: -100px; animation-delay: 2s; }
@keyframes chakraPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.3); opacity: 0.8; }
}

/* ============ VARIABEL ============ */
:root {
    --sidebar-bg: rgba(20, 20, 40, 0.85);
    --card-bg: rgba(255, 255, 255, 0.95);
    --text: #333;
    --text-soft: #777;
    --border: #e0e0e0;
}
body.dark {
    --sidebar-bg: rgba(10, 10, 25, 0.95);
    --card-bg: rgba(30, 41, 59, 0.9);
    --text: #e2e8f0;
    --text-soft: #94a3b8;
    --border: #334155;
}

/* ============ SIDEBAR ============ */
.sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid rgba(255,255,255,0.1); padding: 20px; display: flex; flex-direction: column; gap: 5px; height: 100vh; position: fixed; overflow-y: auto; backdrop-filter: blur(20px); z-index: 100; box-shadow: 4px 0 30px rgba(0,0,0,0.3); }
.logo { font-size: 20px; font-weight: bold; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; color: white; }
.logo span { background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; padding: 8px 12px; border-radius: 8px; box-shadow: 0 0 20px rgba(255,107,53,0.6); animation: logoGlow 2s ease-in-out infinite; }
@keyframes logoGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(255,107,53,0.6); }
    50% { box-shadow: 0 0 40px rgba(255,107,53,1); }
}
.menu-section { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 15px; font-weight: 600; }
.menu-item { padding: 11px 15px; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,0.7); transition: 0.3s; text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 14px; position: relative; overflow: hidden; }
.menu-item::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 0; background: linear-gradient(90deg, #ff6b35, #f7931e); transition: width 0.3s; z-index: -1; border-radius: 8px; }
.menu-item:hover::before, .menu-item.active::before { width: 100%; }
.menu-item:hover, .menu-item.active { color: white; font-weight: 600; transform: translateX(5px); }

/* ============ MAIN ============ */
.main-content { flex: 1; padding: 30px; margin-left: 260px; min-height: 100vh; position: relative; z-index: 2; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: rgba(255,255,255,0.15); padding: 20px; border-radius: 16px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.header h1 { font-size: 24px; color: white; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.header p { color: rgba(255,255,255,0.8); }
.header-actions { display: flex; gap: 10px; align-items: center; }
.user-info { text-align: right; color: white; }
.user-info strong { display: block; font-size: 14px; }
.user-info span { color: rgba(255,255,255,0.7); font-size: 12px; }
.icon-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; color: white; backdrop-filter: blur(10px); }
.icon-btn:hover { background: rgba(255,107,53,0.5); transform: scale(1.1) rotate(10deg); }

/* ============ PAGE ============ */
.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ============ KOTAK-KOTAK DASHBOARD ============ */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
.card { background: rgba(255,255,255,0.95); padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); backdrop-filter: blur(20px); transition: 0.4s; position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); animation: cardEntrance 0.6s ease forwards; opacity: 0; transform: translateY(30px); }
.card:nth-child(1) { animation-delay: 0.1s; }
.card:nth-child(2) { animation-delay: 0.2s; }
.card:nth-child(3) { animation-delay: 0.3s; }
.card:nth-child(4) { animation-delay: 0.4s; }
.card:nth-child(5) { animation-delay: 0.5s; }
@keyframes cardEntrance { to { opacity: 1; transform: translateY(0); } }
.card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,107,53,0.1), transparent); animation: shine 3s linear infinite; pointer-events: none; }
@keyframes shine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
.card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 20px 60px rgba(255,107,53,0.4); border-color: #ff6b35; }
.card h3 { font-size: 12px; color: #777; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
.card p { font-size: 26px; font-weight: bold; color: #333; }
.card-icon { position: absolute; right: 20px; top: 20px; font-size: 32px; opacity: 0.3; transition: 0.3s; }
.card:hover .card-icon { opacity: 0.8; transform: scale(1.2) rotate(10deg); }
.card.blue { background: linear-gradient(135deg, #dbeafe, #93c5fd); } .card.blue p { color: #1e40af; }
.card.green { background: linear-gradient(135deg, #d1fae5, #6ee7b7); } .card.green p { color: #065f46; }
.card.orange { background: linear-gradient(135deg, #fed7aa, #fb923c); } .card.orange p { color: #9a3412; }
.card.purple { background: linear-gradient(135deg, #e9d5ff, #c084fc); } .card.purple p { color: #6b21a8; }

/* ============ RING BOXING ANIMASI ============ */
.boxing-ring {
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f172a 100%);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 100px rgba(255,107,53,0.2);
    border: 3px solid #ff6b35;
    min-height: 280px;
}
.boxing-ring::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff6b35, #f7931e, #ffcc00, #ff6b35);
    background-size: 200% 100%;
    animation: gradientMove 3s linear infinite;
}
@keyframes gradientMove { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

/* Lampu sorot ring */
.spotlight {
    position: absolute;
    top: -50px;
    width: 200px; height: 400px;
    background: linear-gradient(180deg, rgba(255,204,0,0.4), transparent);
    border-radius: 50%;
    filter: blur(30px);
    animation: spotlightMove 4s ease-in-out infinite;
}
.spotlight.left { left: 10%; animation-delay: 0s; }
.spotlight.right { right: 10%; animation-delay: 2s; }
@keyframes spotlightMove { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

/* Tali ring */
.ropes {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100%;
    pointer-events: none;
}
.rope {
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, #ffcc00, #ff6b35, #ffcc00, transparent);
    box-shadow: 0 0 20px #ff6b35;
}
.rope.r1 { top: 25%; animation: ropeGlow 2s ease-in-out infinite; }
.rope.r2 { top: 50%; animation: ropeGlow 2s ease-in-out infinite 0.5s; }
.rope.r3 { top: 75%; animation: ropeGlow 2s ease-in-out infinite 1s; }
@keyframes ropeGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; box-shadow: 0 0 40px #ffcc00; } }

/* Pertandingan boxing */
.boxing-match {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    height: 200px;
    position: relative;
    z-index: 5;
}

.fighter {
    position: relative;
    width: 80px;
    height: 140px;
    animation: bounce 0.6s ease-in-out infinite;
}
.fighter.left { animation-delay: 0s; }
.fighter.right { animation-delay: 0.3s; }
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

/* Kepala */
.fighter .head {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    margin: 0 auto;
    position: relative;
    box-shadow: 0 0 20px rgba(251,191,36,0.5);
}
.fighter.right .head { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 0 20px rgba(239,68,68,0.5); }

/* Sarung tangan */
.fighter .glove {
    position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #dc2626;
    box-shadow: 0 0 15px #dc2626;
    top: 30px;
}
.fighter .glove.left-g { left: -10px; animation: punchLeft 0.8s ease-in-out infinite; }
.fighter .glove.right-g { right: -10px; animation: punchRight 0.8s ease-in-out infinite; }
.fighter.right .glove { background: #1a73e8; box-shadow: 0 0 15px #1a73e8; }
@keyframes punchLeft {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    50% { transform: translate(-15px, -10px) rotate(-20deg); }
}
@keyframes punchRight {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    50% { transform: translate(15px, -10px) rotate(20deg); }
}

/* Badan */
.fighter .body {
    width: 50px; height: 60px;
    background: linear-gradient(135deg, #1e40af, #1e3a8a);
    border-radius: 15px;
    margin: 5px auto 0;
    position: relative;
}
.fighter.right .body { background: linear-gradient(135deg, #7f1d1d, #991b1b); }

/* Kaki */
.fighter .legs {
    display: flex;
    justify-content: space-around;
    margin-top: 5px;
}
.fighter .leg {
    width: 15px; height: 35px;
    background: #1e293b;
    border-radius: 5px;
}

/* Efek pukulan */
.punch-effect {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    animation: punchBurst 1.5s ease-out infinite;
    z-index: 6;
    pointer-events: none;
}
@keyframes punchBurst {
    0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
}

/* VS Text */
.vs-text {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    color: #ffcc00;
    font-size: 32px;
    font-weight: 900;
    text-shadow: 0 0 30px #ff6b35, 0 0 60px #ffcc00;
    animation: vsPulse 1.5s ease-in-out infinite;
    z-index: 7;
    letter-spacing: 3px;
}
@keyframes vsPulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.2); }
}

/* Keringat */
.sweat {
    position: absolute;
    width: 6px; height: 6px;
    background: #93c5fd;
    border-radius: 50%;
    box-shadow: 0 0 10px #93c5fd;
    animation: sweatDrop 1s linear infinite;
}
@keyframes sweatDrop {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(60px) scale(0.3); opacity: 0; }
}

/* Info bar dalam ring */
.ring-info {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 14px;
    font-weight: 600;
    background: rgba(0,0,0,0.6);
    padding: 8px 25px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    border: 1px solid #ff6b35;
    box-shadow: 0 0 20px rgba(255,107,53,0.5);
    z-index: 8;
    white-space: nowrap;
}

/* ============ TABLE ============ */
.table-container { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); backdrop-filter: blur(20px); margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.3); }
.table-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
.table-header h2 { font-size: 16px; color: var(--text); }
.search-box { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: white; width: 200px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text); }
th { color: var(--text-soft); font-weight: 600; font-size: 12px; text-transform: uppercase; }
tr:hover { background: rgba(255,107,53,0.05); }

/* ============ BUTTON ============ */
.btn { padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
.btn-primary { background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; }
.btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
.btn-success { background: linear-gradient(135deg, #0f9d58, #047857); color: white; }
.btn-warning { background: linear-gradient(135deg, #f4b400, #d97706); color: white; }
.btn-secondary { background: #64748b; color: white; }
.btn-sm { padding: 5px 10px; font-size: 11px; margin: 2px; }
.btn-lg { padding: 14px 28px; font-size: 14px; }

/* ============ BADGE ============ */
.badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-green { background: #e6f4ea; color: #0f9d58; }
.badge-red { background: #fce8e6; color: #e74c3c; }
.badge-orange { background: #fef3c7; color: #d97706; }
.badge-blue { background: #dbeafe; color: #1a73e8; }
.badge-purple { background: #ede9fe; color: #8e44ad; }

/* ============ SCRIPT KOTAK-KOTAK ============ */
.script-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
.script-card { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 20px; border-radius: 16px; color: white; position: relative; overflow: hidden; transition: 0.4s; border: 2px solid transparent; animation: cardEntrance 0.5s ease forwards; opacity: 0; display: flex; flex-direction: column; }
.script-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #ff6b35, #f7931e, #ff4757); background-size: 200% 100%; animation: gradientMove 3s linear infinite; }
.script-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 60px rgba(255,107,53,0.5); border-color: #ff6b35; }
.script-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.script-card-header .icon { font-size: 24px; background: linear-gradient(135deg, #ff6b35, #f7931e); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 20px rgba(255,107,53,0.5); flex-shrink: 0; }
.script-card h4 { font-size: 15px; color: white; margin-bottom: 3px; word-break: break-word; }
.script-card small { font-size: 11px; color: rgba(255,255,255,0.6); }
.script-card-preview { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 11px; color: #93c5fd; max-height: 80px; overflow: hidden; margin: 12px 0; border-left: 3px solid #ff6b35; white-space: pre-wrap; word-break: break-all; }
.script-card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; }
.script-card-actions .btn { flex: 1; justify-content: center; }

/* ============ BACKGROUND PICKER ============ */
.bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
.bg-option { height: 110px; border-radius: 12px; cursor: pointer; position: relative; overflow: hidden; background-size: cover; background-position: center; border: 3px solid transparent; transition: 0.3s; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
.bg-option:hover { transform: scale(1.05); border-color: #ff6b35; box-shadow: 0 10px 40px rgba(255,107,53,0.5); }
.bg-option.active { border-color: #0f9d58; box-shadow: 0 0 30px #0f9d58; }
.bg-option span { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); color: white; padding: 20px 10px 8px; font-size: 12px; font-weight: 600; }
.bg-option.active::after { content: '✓'; position: absolute; top: 8px; right: 8px; background: #0f9d58; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 0 15px #0f9d58; }

/* ============ MODAL ============ */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
.modal.active { display: flex; animation: fadeIn 0.2s; }
.modal-content { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 450px; max-width: 90%; max-height: 90vh; overflow-y: auto; color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.modal-content h3 { margin-bottom: 20px; color: var(--text); }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; color: var(--text-soft); font-size: 13px; font-weight: 500; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--card-bg); color: var(--text); transition: 0.2s; }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255,107,53,0.2); }
.modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.empty { text-align: center; padding: 40px; color: var(--text-soft); }
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { padding: 15px 20px; border-radius: 12px; color: white; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: slideIn 0.3s; min-width: 250px; font-weight: 500; }
.toast.success { background: linear-gradient(135deg, #0f9d58, #047857); }
.toast.error { background: linear-gradient(135deg, #e74c3c, #c0392b); }
.toast.info { background: linear-gradient(135deg, #1a73e8, #1e40af); }
@keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }

@media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); transition: 0.3s; }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-left: 0; padding: 15px; }
    .header { flex-direction: column; gap: 10px; align-items: flex-start; }
    .boxing-match { height: 160px; }
    .fighter { width: 60px; height: 110px; }
}
</style>
</head>
<body>

<div class="chakra"></div>
<div class="chakra"></div>
<div class="particles" id="particles"></div>
<div class="toast-container" id="toastContainer"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <div class="logo">
        <span id="logoIcon">G</span>
        <div id="appName">GajiKu Pro</div>
    </div>

    <div class="menu-section">Menu Utama</div>
    <a class="menu-item active" onclick="showPage('dashboard', this)">🏠 Dashboard</a>

    <div class="menu-section">Keuangan</div>
    <a class="menu-item" onclick="showPage('gaji', this)">💰 Daftar Gaji</a>
